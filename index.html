<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BSENFLOW</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#111;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#111,#3b315f,#635bff);
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:28px;
  padding:32px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:35px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span,
.brand span{
  color:#635bff;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:28px;
}

.auth-box input{
  width:100%;
  padding:15px 17px;
  margin-bottom:13px;
  border:1px solid #ddd;
  border-radius:15px;
  outline:none;
}

.auth-box input:focus{
  border-color:#635bff;
  box-shadow:0 0 0 3px rgba(99,91,255,.1);
}

.main-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#635bff,#8b5cf6);
}

.main-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.google-btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:1px solid #ddd;
  border-radius:15px;
  background:#fff;
  font-weight:700;
}

.google-btn:hover{
  background:#f7f7f7;
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#777;
  font-size:14px;
}

.switch span{
  color:#635bff;
  font-weight:800;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:14px;
  font-size:14px;
  min-height:20px;
  color:#555;
}

.message.error{
  color:#d93025;
}

.message.success{
  color:#188038;
}

.app{
  display:none;
  min-height:100vh;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:25px;
  font-weight:900;
}

.user-area{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(135deg,#635bff,#111);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-button{
  border:0;
  background:#635bff;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  font-weight:700;
}

.logout{
  border:0;
  background:#f0f0f4;
  padding:10px 15px;
  border-radius:12px;
  font-weight:700;
}

.content{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.hero{
  background:#fff;
  border-radius:28px;
  padding:50px 25px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  color:#777;
  font-size:17px;
  margin-top:8px;
}

.premium{
  margin-top:25px;
  display:inline-block;
  padding:14px 24px;
  border-radius:15px;
  color:#fff;
  background:#111;
  font-weight:800;
}

.profile-card{
  margin-top:25px;
  padding:25px;
  background:#fff;
  border-radius:22px;
  text-align:left;
  border:1px solid #eee;
}

.profile-row{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-avatar-large{
  width:65px;
  height:65px;
  flex-shrink:0;
  border-radius:50%;
  background:linear-gradient(135deg,#635bff,#111);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
  font-size:20px;
  overflow:hidden;
}

.profile-avatar-large img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profile-info strong{
  font-size:18px;
}

.profile-info small{
  display:block;
  color:#777;
  margin-top:5px;
}

.edit-profile-box{
  margin-top:22px;
  padding:20px;
  background:#f7f7fa;
  border-radius:18px;
  display:none;
}

.edit-profile-box input,
.edit-profile-box textarea{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
  margin-bottom:12px;
  background:#fff;
}

.edit-profile-box textarea{
  min-height:90px;
  resize:vertical;
}

.edit-profile-box input:focus,
.edit-profile-box textarea:focus{
  border-color:#635bff;
}

.edit-btn{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:0;
  border-radius:14px;
  background:#111;
  color:#fff;
  font-weight:800;
}

.save-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#635bff;
  color:#fff;
  font-weight:800;
}

.save-btn:disabled{
  opacity:.6;
}

.profile-message{
  text-align:center;
  margin-top:10px;
  font-size:14px;
  min-height:20px;
}

@media(max-width:600px){

  .auth-box{
    padding:25px;
  }

  .hero{
    padding:35px 18px;
  }

  .hero h1{
    font-size:32px;
  }

  .topbar{
    padding:0 12px;
  }

  .brand{
    font-size:21px;
  }

  .profile-button{
    display:none;
  }

  .logout{
    padding:9px 12px;
  }

}

</style>
</head>

<body>

<!-- =========================
     LOGIN / SIGNUP
========================= -->

<div class="auth-page" id="authPage">

  <div class="auth-box">

    <div class="logo">
      BSEN<span>FLOW</span>
    </div>

    <div class="subtitle" id="authSubtitle">
      Welcome back
    </div>

    <input
      id="nameInput"
      type="text"
      placeholder="Your name"
      autocomplete="name"
      style="display:none"
    >

    <input
      id="emailInput"
      type="email"
      placeholder="Email"
      autocomplete="email"
    >

    <input
      id="passwordInput"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      class="main-btn"
      id="mainBtn"
      type="button"
    >
      Login
    </button>

    <button
      class="google-btn"
      id="googleBtn"
      type="button"
    >
      🔵 Continue with Google
    </button>

    <div
      class="message"
      id="authMessage"
    ></div>

    <div class="switch">
      <span id="switchText">
        Create new account
      </span>
    </div>

  </div>

</div>


<!-- =========================
     MAIN APP
========================= -->

<div
  class="app"
  id="app"
>

  <header class="topbar">

    <div class="brand">
      BSEN<span>FLOW</span>
    </div>

    <div class="user-area">

      <button
        class="profile-button"
        id="profileButton"
        type="button"
      >
        👤 Profile
      </button>

      <div
        class="avatar"
        id="topAvatar"
      >
        BS
      </div>

      <button
        class="logout"
        id="logoutBtn"
        type="button"
      >
        Logout
      </button>

    </div>

  </header>


  <main class="content">

    <section class="hero">

      <h1>
        Welcome to BSENFLOW 🚀
      </h1>

      <p id="welcomeText">
        The next generation of social networking.
      </p>

      <div class="premium">
        ❖ BSENFLOW Premium
      </div>


      <!-- PROFILE -->

      <div class="profile-card">

        <div class="profile-row">

          <div
            class="profile-avatar-large"
            id="profileAvatar"
          >
            BS
          </div>

          <div class="profile-info">

            <strong id="profileName">
              BSENFLOW User
            </strong>

            <small id="profileEmail">
              Loading...
            </small>

            <small id="profileBio">
              No bio added yet.
            </small>

            <small>
              Founder: Bharat Sain
            </small>

          </div>

        </div>


        <button
          class="edit-btn"
          id="editProfileBtn"
          type="button"
        >
          ✏️ Edit Profile
        </button>


        <div
          class="edit-profile-box"
          id="editProfileBox"
        >

          <input
            id="editNameInput"
            type="text"
            placeholder="Your name"
          >

          <textarea
            id="editBioInput"
            placeholder="Write something about yourself..."
          ></textarea>

          <button
            class="save-btn"
            id="saveProfileBtn"
            type="button"
          >
            💾 Save Profile
          </button>

          <div
            class="profile-message"
            id="profileMessage"
          ></div>

        </div>

      </div>

    </section>

  </main>

</div>


<script type="module">

/* =========================
   FIREBASE IMPORTS
========================= */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCfBlYDE7hz8yUXTxtUpATBmCqR4qZ1fsI",

  authDomain:
    "bsenflow.firebaseapp.com",

  projectId:
    "bsenflow",

  storageBucket:
    "bsenflow.firebasestorage.app",

  messagingSenderId:
    "757334229298",

  appId:
    "1:757334229298:web:8d1d9ba615c09d1edad72b",

  measurementId:
    "G-4KYD657J4K"

};


/* =========================
   INITIALIZE FIREBASE
========================= */

const firebaseApp =
  initializeApp(firebaseConfig);

const auth =
  getAuth(firebaseApp);

const db =
  getFirestore(firebaseApp);

const googleProvider =
  new GoogleAuthProvider();


/* =========================
   MAKE FIREBASE AVAILABLE
   FOR FUTURE ADD-ON CODE
========================= */

window.BSENFLOW = {

  firebaseApp,
  auth,
  db,
  googleProvider,

  firebase: {

    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signInWithPopup,
    signOut,
    updateProfile,

    doc,
    setDoc,
    getDoc,
    serverTimestamp

  }

};


/* =========================
   ELEMENTS
========================= */

const authPage =
  document.getElementById("authPage");

const appPage =
  document.getElementById("app");

const nameInput =
  document.getElementById("nameInput");

const emailInput =
  document.getElementById("emailInput");

const passwordInput =
  document.getElementById("passwordInput");

const mainBtn =
  document.getElementById("mainBtn");

const googleBtn =
  document.getElementById("googleBtn");

const switchText =
  document.getElementById("switchText");

const authSubtitle =
  document.getElementById("authSubtitle");

const authMessage =
  document.getElementById("authMessage");

const logoutBtn =
  document.getElementById("logoutBtn");

const profileButton =
  document.getElementById("profileButton");

const welcomeText =
  document.getElementById("welcomeText");

const topAvatar =
  document.getElementById("topAvatar");

const profileAvatar =
  document.getElementById("profileAvatar");

const profileName =
  document.getElementById("profileName");

const profileEmail =
  document.getElementById("profileEmail");

const profileBio =
  document.getElementById("profileBio");

const editProfileBtn =
  document.getElementById("editProfileBtn");

const editProfileBox =
  document.getElementById("editProfileBox");

const editNameInput =
  document.getElementById("editNameInput");

const editBioInput =
  document.getElementById("editBioInput");

const saveProfileBtn =
  document.getElementById("saveProfileBtn");

const profileMessage =
  document.getElementById("profileMessage");


let signupMode = false;


/* =========================
   MESSAGE HELPERS
========================= */

function showAuthMessage(
  text,
  type = ""
){

  authMessage.textContent = text;

  authMessage.className =
    "message " + type;

}


function showProfileMessage(
  text,
  type = ""
){

  profileMessage.textContent = text;

  profileMessage.style.color =
    type === "error"
      ? "#d93025"
      : "#188038";

}


/* =========================
   AUTH MODE SWITCH
========================= */

switchText.addEventListener(
  "click",
  function(){

    signupMode =
      !signupMode;

    nameInput.style.display =
      signupMode
        ? "block"
        : "none";

    mainBtn.textContent =
      signupMode
        ? "Create Account"
        : "Login";

    switchText.textContent =
      signupMode
        ? "Already have an account? Login"
        : "Create new account";

    authSubtitle.textContent =
      signupMode
        ? "Create your BSENFLOW account"
        : "Welcome back";

    passwordInput.autocomplete =
      signupMode
        ? "new-password"
        : "current-password";

    showAuthMessage("");

  }
);


/* =========================
   EMAIL LOGIN / SIGNUP
========================= */

mainBtn.addEventListener(
  "click",
  async function(){

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const name =
      nameInput.value.trim();


    if(!email){

      showAuthMessage(
        "Please enter your email.",
        "error"
      );

      return;

    }


    if(!password){

      showAuthMessage(
        "Please enter your password.",
        "error"
      );

      return;

    }


    if(signupMode && !name){

      showAuthMessage(
        "Please enter your name.",
        "error"
      );

      return;

    }


    if(signupMode && password.length < 6){

      showAuthMessage(
        "Password must be at least 6 characters.",
        "error"
      );

      return;

    }


    mainBtn.disabled = true;

    mainBtn.textContent =
      signupMode
        ? "Creating..."
        : "Logging in...";


    try{

      if(signupMode){

        /* CREATE AUTH USER */

        const result =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        const user =
          result.user;


        /* UPDATE AUTH PROFILE */

        await updateProfile(
          user,
          {
            displayName:name
          }
        );


        /* CREATE FIRESTORE USER */

        await setDoc(
          doc(
            db,
            "users",
            user.uid
          ),
          {

            uid:user.uid,

            name:name,

            email:email,

            bio:"",

            profilePhoto:"",

            followers:0,

            following:0,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }
        );


        showAuthMessage(
          "Account created successfully! ✅",
          "success"
        );


      }else{

        /* LOGIN */

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }


    }catch(error){

      console.error(
        "BSENFLOW AUTH ERROR:",
        error
      );

      showAuthMessage(
        getFriendlyError(error.code),
        "error"
      );


    }finally{

      mainBtn.disabled = false;

      mainBtn.textContent =
        signupMode
          ? "Create Account"
          : "Login";

    }

  }
);


/* =========================
   GOOGLE LOGIN
========================= */

googleBtn.addEventListener(
  "click",
  async function(){

    googleBtn.disabled = true;

    googleBtn.textContent =
      "Connecting to Google...";


    try{

      const result =
        await signInWithPopup(
          auth,
          googleProvider
        );


      const user =
        result.user;


      /* GET EXISTING USER */

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnap =
        await getDoc(userRef);


      if(userSnap.exists()){

        /* EXISTING USER */

        await setDoc(
          userRef,
          {

            name:
              user.displayName ||
              userSnap.data().name ||
              "BSENFLOW User",

            email:
              user.email ||
              userSnap.data().email ||
              "",

            profilePhoto:
              user.photoURL ||
              userSnap.data().profilePhoto ||
              "",

            updatedAt:
              serverTimestamp()

          },
          {
            merge:true
          }
        );


      }else{

        /* NEW GOOGLE USER */

        await setDoc(
          userRef,
          {

            uid:user.uid,

            name:
              user.displayName ||
              "BSENFLOW User",

            email:
              user.email ||
              "",

            bio:"",

            profilePhoto:
              user.photoURL ||
              "",

            followers:0,

            following:0,

            createdAt:
              serverTimestamp(),

            updatedAt:
              serverTimestamp()

          }
        );

      }


    }catch(error){

      console.error(
        "BSENFLOW GOOGLE ERROR:",
        error
      );

      showAuthMessage(
        getFriendlyError(error.code),
        "error"
      );


    }finally{

      googleBtn.disabled = false;

      googleBtn.textContent =
        "🔵 Continue with Google";

    }

  }
);


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
  "click",
  async function(){

    try{

      await signOut(auth);

    }catch(error){

      console.error(
        "Logout error:",
        error
      );

    }

  }
);


/* =========================
   AVATAR
========================= */

function setAvatar(
  element,
  name,
  photo
){

  if(!element) return;


  if(photo){

    element.innerHTML =
      `<img src="${photo}" alt="Profile">`;

    return;

  }


  const cleanName =
    name || "BS";


  const initials =
    cleanName
      .trim()
      .substring(0,2)
      .toUpperCase();


  element.textContent =
    initials;

}


/* =========================
   LOAD USER PROFILE
========================= */

async function loadUserProfile(user){

  if(!user) return;


  let name =
    user.displayName ||
    user.email?.split("@")[0] ||
    "BSENFLOW User";


  let bio = "";

  let photo =
    user.photoURL || "";


  try{

    const userRef =
      doc(
        db,
        "users",
        user.uid
      );


    const userSnap =
      await getDoc(userRef);


    if(userSnap.exists()){

      const data =
        userSnap.data();


      name =
        data.name ||
        name;


      bio =
        data.bio ||
        "";


      photo =
        data.profilePhoto ||
        photo;

    }


  }catch(error){

    console.error(
      "Profile load error:",
      error
    );

  }


  profileName.textContent =
    name;


  profileEmail.textContent =
    user.email || "";


  profileBio.textContent =
    bio ||
    "No bio added yet.";


  welcomeText.textContent =
    "Welcome, " +
    name +
    " 👋";


  editNameInput.value =
    name;


  editBioInput.value =
    bio;


  setAvatar(
    topAvatar,
    name,
    photo
  );


  setAvatar(
    profileAvatar,
    name,
    photo
  );

}


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(
  auth,
  async function(user){

    if(user){

      authPage.style.display =
        "none";

      appPage.style.display =
        "block";


      await loadUserProfile(user);


    }else{

      authPage.style.display =
        "flex";

      appPage.style.display =
        "none";

      editProfileBox.style.display =
        "none";

    }

  }
);


/* =========================
   PROFILE BUTTON
========================= */

profileButton.addEventListener(
  "click",
  function(){

    const profileCard =
      document.querySelector(
        ".profile-card"
      );


    if(profileCard){

      profileCard.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  }
);


/* =========================
   EDIT PROFILE
========================= */

editProfileBtn.addEventListener(
  "click",
  function(){

    if(
      editProfileBox.style.display ===
      "block"
    ){

      editProfileBox.style.display =
        "none";

    }else{

      editProfileBox.style.display =
        "block";

      editNameInput.focus();

    }

  }
);


/* =========================
   SAVE PROFILE
========================= */

saveProfileBtn.addEventListener(
  "click",
  async function(){

    const user =
      auth.currentUser;


    if(!user){

      showProfileMessage(
        "Please login first.",
        "error"
      );

      return;

    }


    const newName =
      editNameInput.value.trim();


    const newBio =
      editBioInput.value.trim();


    if(!newName){

      showProfileMessage(
        "Please enter your name.",
        "error"
      );

      return;

    }


    saveProfileBtn.disabled =
      true;

    saveProfileBtn.textContent =
      "Saving...";


    try{

      /* UPDATE FIREBASE AUTH */

      await updateProfile(
        user,
        {
          displayName:newName
        }
      );


      /* UPDATE FIRESTORE */

      await setDoc(
        doc(
          db,
          "users",
          user.uid
        ),
        {

          uid:user.uid,

          name:newName,

          email:
            user.email || "",

          bio:newBio,

          profilePhoto:
            user.photoURL || "",

          updatedAt:
            serverTimestamp()

        },
        {
          merge:true
        }
      );


      /* UPDATE SCREEN */

      profileName.textContent =
        newName;


      profileBio.textContent =
        newBio ||
        "No bio added yet.";


      welcomeText.textContent =
        "Welcome, " +
        newName +
        " 👋";


      setAvatar(
        topAvatar,
        newName,
        user.photoURL || ""
      );


      setAvatar(
        profileAvatar,
        newName,
        user.photoURL || ""
      );


      showProfileMessage(
        "Profile saved successfully! ✅",
        "success"
      );


      setTimeout(
        function(){

          editProfileBox.style.display =
            "none";

          showProfileMessage("");

        },
        1200
      );


    }catch(error){

      console.error(
        "PROFILE SAVE ERROR:",
        error
      );


      showProfileMessage(
        getFriendlyError(error.code),
        "error"
      );


    }finally{

      saveProfileBtn.disabled =
        false;

      saveProfileBtn.textContent =
        "💾 Save Profile";

    }

  }
);


/* =========================
   FRIENDLY FIREBASE ERRORS
========================= */

function getFriendlyError(code){

  switch(code){

    case "auth/invalid-email":

      return "Invalid email address.";

    case "auth/user-not-found":

      return "No account found with this email.";

    case "auth/wrong-password":

      return "Email or password is incorrect.";

    case "auth/invalid-credential":

      return "Email or password is incorrect.";

    case "auth/email-already-in-use":

      return "This email is already registered. Please login.";

    case "auth/weak-password":

      return "Password must be at least 6 characters.";

    case "auth/popup-closed-by-user":

      return "Google login was cancelled.";

    case "auth/popup-blocked":

      return "Google popup was blocked by the browser.";

    case "auth/unauthorized-domain":

      return "This website domain is not authorized in Firebase.";

    case "auth/network-request-failed":

      return "Network error. Please check your internet.";

    case "permission-denied":

      return "Firestore permission denied. Check Firestore Rules.";

    case "failed-precondition":

      return "Firebase configuration needs attention.";

    default:

      return (
        "Something went wrong. Please try again."
      );

  }

}


/* =========================
   GLOBAL ERROR LOGGING
========================= */

window.addEventListener(
  "error",
  function(event){

    console.error(
      "BSENFLOW ERROR:",
      event.error || event.message
    );

  }
);


window.addEventListener(
  "unhandledrejection",
  function(event){

    console.error(
      "BSENFLOW PROMISE ERROR:",
      event.reason
    );

  }
);

</script>

<script type="module">

/* =====================================================
   BSENFLOW PROFESSIONAL EMAIL LOGIN
   APPEND-ONLY VERSION
===================================================== */

import {
  sendSignInLinkToEmail,
  isSignInWithEmailLink,
  signInWithEmailLink
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const BF = window.BSENFLOW;

if (!BF || !BF.auth) {

  console.error("BSENFLOW Firebase system not found.");

} else {

  const auth = BF.auth;

  const firebaseTools = BF.firebase;


  /* =====================================================
     EMAIL ACTION SETTINGS
  ===================================================== */

  const actionCodeSettings = {

    url:
      window.location.origin +
      window.location.pathname,

    handleCodeInApp:true

  };


  /* =====================================================
     CREATE PROFESSIONAL LOGIN BOX
  ===================================================== */

  const authBox =
    document.querySelector(".auth-box");


  if (authBox) {

    const oldPassword =
      document.getElementById("passwordInput");


    const oldMainButton =
      document.getElementById("mainBtn");


    const oldGoogle =
      document.getElementById("googleBtn");


    /* Password login temporarily hidden */

    if (oldPassword) {
      oldPassword.style.display = "none";
    }


    if (oldMainButton) {
      oldMainButton.style.display = "none";
    }


    /* Create email login button */

    if (
      !document.getElementById(
        "bflowEmailContinue"
      )
    ) {

      const emailButton =
        document.createElement("button");


      emailButton.id =
        "bflowEmailContinue";


      emailButton.type =
        "button";


      emailButton.textContent =
        "Continue with Email →";


      emailButton.style.cssText = `

        width:100%;
        padding:15px;
        border:0;
        border-radius:15px;
        color:#fff;
        font-weight:800;
        background:
          linear-gradient(
            135deg,
            #635bff,
            #8b5cf6
          );
        cursor:pointer;
        margin-top:4px;

      `;


      if (oldGoogle) {

        oldGoogle.parentNode.insertBefore(
          emailButton,
          oldGoogle
        );

      } else {

        authBox.appendChild(
          emailButton
        );

      }


      /* =================================================
         EMAIL LINK SEND
      ================================================= */

      emailButton.addEventListener(
        "click",
        async function(){

          const emailInput =
            document.getElementById(
              "emailInput"
            );


          const email =
            emailInput?.value.trim();


          const message =
            document.getElementById(
              "authMessage"
            );


          if (!email) {

            if (message) {

              message.textContent =
                "Please enter your email.";

              message.className =
                "message error";

            }

            return;

          }


          emailButton.disabled =
            true;


          emailButton.textContent =
            "Sending secure email...";


          try {

            await sendSignInLinkToEmail(
              auth,
              email,
              actionCodeSettings
            );


            /* Save email locally */

            window.localStorage.setItem(
              "bsenflowEmailForSignIn",
              email
            );


            if (message) {

              message.textContent =
                "📩 Check your email. Your secure BSENFLOW login link has been sent.";

              message.className =
                "message success";

            }


            emailButton.textContent =
              "Email Sent ✓";


          } catch(error) {

            console.error(
              "BSENFLOW EMAIL LINK ERROR:",
              error
            );


            if (message) {

              message.textContent =
                "Unable to send login email. " +
                (
                  error.code ||
                  "Please try again."
                );

              message.className =
                "message error";

            }


            emailButton.disabled =
              false;


            emailButton.textContent =
              "Continue with Email →";

          }

        }
      );

    }

  }


  /* =====================================================
     COMPLETE EMAIL LINK LOGIN
  ===================================================== */

  if (
    isSignInWithEmailLink(
      auth,
      window.location.href
    )
  ) {

    let email =
      window.localStorage.getItem(
        "bsenflowEmailForSignIn"
      );


    if (!email) {

      email =
        window.prompt(
          "Please enter your email to complete BSENFLOW login:"
        );

    }


    if (email) {

      try {

        const result =
          await signInWithEmailLink(
            auth,
            email,
            window.location.href
          );


        window.localStorage.removeItem(
          "bsenflowEmailForSignIn"
        );


        console.log(
          "BSENFLOW Email Login Success:",
          result.user.uid
        );


        /* Clean URL */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


      } catch(error) {

        console.error(
          "BSENFLOW EMAIL VERIFICATION ERROR:",
          error
        );


        alert(
          "Email verification failed. Please request a new login link."
        );

      }

    }

  }

}

</script>

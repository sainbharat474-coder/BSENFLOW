<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BSENFLOW</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#111;
}
button,input{font:inherit}
button{cursor:pointer}

.auth-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(135deg,#111,#3b315f,#635bff);
}

.auth-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:28px;
  padding:32px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  margin-bottom:8px;
}

.logo span,.brand span{color:#635bff}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:28px;
}

.auth-box input{
  width:100%;
  padding:15px 17px;
  margin-bottom:13px;
  border:1px solid #ddd;
  border-radius:15px;
  outline:none;
}

.auth-box input:focus{border-color:#635bff}

.main-btn{
  width:100%;
  padding:15px;
  border:0;
  border-radius:15px;
  color:#fff;
  font-weight:800;
  background:linear-gradient(135deg,#635bff,#8b5cf6);
}

.google-btn{
  width:100%;
  padding:14px;
  margin-top:12px;
  border:1px solid #ddd;
  border-radius:15px;
  background:#fff;
  font-weight:700;
}

.switch{
  text-align:center;
  margin-top:20px;
  color:#777;
  font-size:14px;
}

.switch span{
  color:#635bff;
  font-weight:800;
  cursor:pointer;
}

.message{
  text-align:center;
  margin-top:14px;
  font-size:14px;
  min-height:20px;
}

.app{display:none;min-height:100vh}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid #eee;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:10;
}

.brand{
  font-size:25px;
  font-weight:900;
}

.user-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:linear-gradient(135deg,#635bff,#111);
  color:#fff;
  display:grid;
  place-items:center;
  font-weight:900;
}

.logout{
  border:0;
  background:#f0f0f4;
  padding:10px 15px;
  border-radius:12px;
  font-weight:700;
}

.content{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}

.hero{
  background:#fff;
  border-radius:28px;
  padding:50px 25px;
  text-align:center;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.hero h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero p{
  color:#777;
  font-size:17px;
  margin-top:8px;
}

.premium{
  margin-top:25px;
  display:inline-block;
  padding:14px 24px;
  border-radius:15px;
  color:#fff;
  background:#111;
  font-weight:800;
}

.profile-card{
  margin-top:25px;
  padding:25px;
  background:#fff;
  border-radius:22px;
  text-align:left;
}

.profile-row{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile-info strong{font-size:18px}

.profile-info small{
  display:block;
  color:#777;
  margin-top:5px;
}

@media(max-width:600px){
  .auth-box{padding:25px}
  .hero h1{font-size:32px}
  .topbar{padding:0 15px}
}
</style>
</head>

<body>

<!-- AUTHENTICATION -->

<div class="auth-page" id="authPage">

  <div class="auth-box">

    <div class="logo">BSEN<span>FLOW</span></div>

    <div class="subtitle" id="authSubtitle">
      Welcome back
    </div>

    <input
      id="name"
      type="text"
      placeholder="Your name"
      style="display:none"
    >

    <input
      id="email"
      type="email"
      placeholder="Email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <button class="main-btn" id="mainBtn">
      Login
    </button>

    <button class="google-btn" id="googleBtn">
      🔵 Continue with Google
    </button>

    <div class="message" id="message"></div>

    <div class="switch">
      <span id="switchText">Create new account</span>
    </div>

  </div>

</div>


<!-- MAIN APP -->

<div class="app" id="app">

  <header class="topbar">

    <div class="brand">
      BSEN<span>FLOW</span>
    </div>

    <div class="user-area">

      <div class="avatar" id="avatar">
        BS
      </div>

      <button class="logout" id="logoutBtn">
        Logout
      </button>

    </div>

  </header>


  <main class="content">

    <section class="hero">

      <h1>Welcome to BSENFLOW 🚀</h1>

      <p id="welcomeText">
        The next generation of social networking.
      </p>

      <div class="premium">
        ❖ BSENFLOW Premium
      </div>

      <div class="profile-card">

        <div class="profile-row">

          <div class="avatar" id="profileAvatar">
            BS
          </div>

          <div class="profile-info">

            <strong id="profileName">
              BSENFLOW User
            </strong>

            <small id="profileEmail">
              Loading...
            </small>

            <small>
              Founder: Bharat Sain
            </small>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<script type="module">

/* FIREBASE APP */

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


/* FIREBASE AUTH */

import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* FIRESTORE */

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {
  apiKey: "AIzaSyCfBlYDE7hz8yUXTxtUpATBmCqR4qZ1fsI",
  authDomain: "bsenflow.firebaseapp.com",
  projectId: "bsenflow",
  storageBucket: "bsenflow.firebasestorage.app",
  messagingSenderId: "757334229298",
  appId: "1:757334229298:web:8d1d9ba615c09d1edad72b",
  measurementId: "G-4KYD657J4K"
};


/* INITIALIZE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const googleProvider = new GoogleAuthProvider();


/* ELEMENTS */

const authPage = document.getElementById("authPage");
const appPage = document.getElementById("app");

const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

const mainBtn = document.getElementById("mainBtn");
const googleBtn = document.getElementById("googleBtn");

const switchText = document.getElementById("switchText");
const authSubtitle = document.getElementById("authSubtitle");

const message = document.getElementById("message");

const logoutBtn = document.getElementById("logoutBtn");

const welcomeText = document.getElementById("welcomeText");

const avatar = document.getElementById("avatar");
const profileAvatar = document.getElementById("profileAvatar");

const profileName = document.getElementById("profileName");
const profileEmail = document.getElementById("profileEmail");


let signupMode = false;


/* LOGIN / SIGNUP SWITCH */

switchText.addEventListener("click", () => {

  signupMode = !signupMode;

  nameInput.style.display =
    signupMode ? "block" : "none";

  mainBtn.textContent =
    signupMode ? "Create Account" : "Login";

  switchText.textContent =
    signupMode
      ? "Already have an account? Login"
      : "Create new account";

  authSubtitle.textContent =
    signupMode
      ? "Create your BSENFLOW account"
      : "Welcome back";

  message.textContent = "";

});


/* EMAIL LOGIN / SIGNUP */

mainBtn.addEventListener("click", async () => {

  const email = emailInput.value.trim();

  const password = passwordInput.value;

  const name = nameInput.value.trim();


  if(!email || !password){

    message.textContent =
      "Please enter email and password.";

    return;

  }


  try{

    if(signupMode){

      if(!name){

        message.textContent =
          "Please enter your name.";

        return;

      }


      /* CREATE AUTH ACCOUNT */

      const result =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      /* SAVE DISPLAY NAME */

      await updateProfile(
        result.user,
        {
          displayName:name
        }
      );


      /* SAVE USER TO FIRESTORE */

      await setDoc(
        doc(db, "users", result.user.uid),
        {
          uid: result.user.uid,
          name: name,
          email: email,
          bio: "",
          profilePhoto: "",
          followers: 0,
          following: 0,
          createdAt: serverTimestamp()
        }
      );


      message.textContent =
        "Account created successfully!";


    }else{

      /* LOGIN */

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

    }

  }catch(error){

    console.error(error);

    message.textContent =
      getFriendlyError(error.code);

  }

});


/* GOOGLE LOGIN */

googleBtn.addEventListener("click", async () => {

  try{

    const result =
      await signInWithPopup(
        auth,
        googleProvider
      );


    const user = result.user;


    /* SAVE / UPDATE GOOGLE USER */

    await setDoc(
      doc(db, "users", user.uid),
      {
        uid: user.uid,
        name:
          user.displayName ||
          "BSENFLOW User",
        email:
          user.email || "",
        bio: "",
        profilePhoto:
          user.photoURL || "",
        followers: 0,
        following: 0,
        createdAt:
          serverTimestamp()
      },
      {
        merge:true
      }
    );


  }catch(error){

    console.error(error);

    message.textContent =
      getFriendlyError(error.code);

  }

});


/* LOGOUT */

logoutBtn.addEventListener(
  "click",
  async () => {

    await signOut(auth);

  }
);


/* AUTH STATE */

onAuthStateChanged(
  auth,
  user => {

    if(user){

      authPage.style.display = "none";

      appPage.style.display = "block";


      const displayName =
        user.displayName ||
        user.email?.split("@")[0] ||
        "User";


      welcomeText.textContent =
        "Welcome, " +
        displayName +
        " 👋";


      profileName.textContent =
        displayName;


      profileEmail.textContent =
        user.email || "";


      const initials =
        displayName
          .substring(0,2)
          .toUpperCase();


      avatar.textContent =
        initials;

      profileAvatar.textContent =
        initials;


    }else{

      authPage.style.display = "flex";

      appPage.style.display = "none";

    }

  }
);


/* ERROR MESSAGES */

function getFriendlyError(code){

  switch(code){

    case "auth/invalid-email":
      return "Invalid email address.";

    case "auth/user-not-found":
      return "No account found with this email.";

    case "auth/wrong-password":
    case "auth/invalid-credential":
      return "Email or password is incorrect.";

    case "auth/email-already-in-use":
      return "This email is already registered.";

    case "auth/weak-password":
      return "Password should be at least 6 characters.";

    case "auth/popup-closed-by-user":
      return "Google login was cancelled.";

    case "auth/unauthorized-domain":
      return "This website domain is not authorized in Firebase.";

    case "permission-denied":
      return "Firestore permission denied. Check Firestore Rules.";

    default:
      return "Something went wrong. Please try again.";

  }

}

</script>

</body>
<script>
/* BSENFLOW PROFILE BUTTON - ADD ON */

(function () {

  const userArea = document.querySelector(".user-area");

  if (!userArea) return;

  const profileBtn = document.createElement("button");

  profileBtn.id = "bflowProfileBtn";

  profileBtn.innerHTML = "👤 Profile";

  profileBtn.style.cssText = `
    border:0;
    background:#635bff;
    color:#fff;
    padding:10px 15px;
    border-radius:12px;
    font-weight:800;
    cursor:pointer;
  `;

  profileBtn.onclick = function () {

    const profileCard =
      document.querySelector(".profile-card");

    if (profileCard) {

      profileCard.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  };

  userArea.insertBefore(
    profileBtn,
    userArea.querySelector(".logout")
  );

})();
</script>
